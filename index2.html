  <script>
  document.addEventListener('DOMContentLoaded', function() {//等待HTML加载完成//
  const slides = document.querySelectorAll('.slide'); //获取class属性包含的slide的元素,并返回（赋值）给slides//
  const dots = document.querySelectorAll('.dot');
  let currentIndex = 0;//声明变量用来记录幻灯片//
  let autoPlay;//声明变量储存setInterval返回的定时器ID，以便后续可以清除定时器//


//函数//
  function goToSlide(index) {
    slides[currentIndex].classList.remove('active');//一处active类//
    dots[currentIndex].classList.remove('active');//移除active//
    currentIndex = (index + slides.length) % slides.length;//计算新的索引，使其循环//
    slides[currentIndex].classList.add('active');//给新的幻灯片添加active类，使其显现出来//
    dots[currentIndex].classList.add('active');//添加active，使其高亮//
  }

  //函数//
  function nextSlide() {
    goToSlide(currentIndex + 1);
  }//调用goToSlide并传入currentIndex+1，切换到下一张幻灯片//

  function startAutoPlay() {
    autoPlay = setInterval(nextSlide, 4000);
  }//启动自动播放//

  dots.forEach(dot => {
    dot.addEventListener('click', () => {//当被点击的时候执行箭头函数//
      clearInterval(autoPlay);//清除自动播放//
      goToSlide(parseInt(dot.dataset.index));
      startAutoPlay();//重新启动自动播放//
    });
  });

  startAutoPlay();//调用startAutoPlay函数，开启自动播放//
  });
  // 获取所有导航项
    const navItems = document.querySelectorAll('.nav-item');

    navItems.forEach(item => {
      item.addEventListener('click', () => {
        // 1. 先移除所有项的 active 类
        navItems.forEach(nav => nav.classList.remove('active'));
        // 2. 给当前点击的项加上 active 类
        item.classList.add('active');
      });
    });
    const searchinput=document.getElementById('search-input')
    const hotsearchbox=document.getElementById('HOT');
    searchinput.addEventListener('click',function(e){
      e.stopPropagation();
      hotsearchbox.classList.add('show');
    });

    document.addEventListener('click',function(){
      hotsearchbox.classList.remove('show');
    });

    hotsearchbox.addEventListener('click',function(e){
      e.stopImmediatePropagation();
    });
  </script>
